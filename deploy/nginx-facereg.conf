# ─────────────────────────────────────────────────────────────────────
# nginx reverse proxy สำหรับ FaceReg (production)
#
# ติดตั้ง:
#   sudo apt install nginx
#   sudo cp deploy/nginx-facereg.conf /etc/nginx/sites-available/facereg
#   sudo ln -s /etc/nginx/sites-available/facereg /etc/nginx/sites-enabled/facereg
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# สำหรับ HTTPS (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d <your-domain>
# ─────────────────────────────────────────────────────────────────────

upstream stream_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream api_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # รับทุก IP/domain — เปลี่ยนเป็น domain จริงเมื่อมี

    # ─── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # ─── React SPA (dist/) ────────────────────────────────────────────
    root /home/maeb/internship_work/FaceReg/front_end/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # assets ที่มี hash ใน filename — cache นาน
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Stream server API (/auth /cameras /system /state /stream …) ──
    location ~ ^/(auth|cameras|system|state|stream|snapshot|snap|snapfull|push|cache|audit|users|admin|watchdog|readyz|healthz) {
        proxy_pass         http://stream_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE ─ stream MJPEG ต้องการ Connection: upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # MJPEG stream อาจนานมาก — ขยาย timeout
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # ─── Attendance API (port 8000) ───────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ไฟล์ export อาจใหญ่
        proxy_read_timeout  60s;
        client_max_body_size 10m;
    }

    # ─── Health (ไม่ต้อง auth ใช้สำหรับ load balancer / uptime monitor) ─
    location = /healthz {
        proxy_pass http://stream_backend/healthz;
        access_log off;
    }
}
