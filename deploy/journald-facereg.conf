# journald drop-in config สำหรับ FaceReg
# ติดตั้ง: sudo cp deploy/journald-facereg.conf /etc/systemd/journald.conf.d/facereg.conf
#           sudo systemctl restart systemd-journald
#
# ตรวจสอบหลังติดตั้ง: journalctl --disk-usage

[Journal]
# เก็บ log รวมทั้งหมดไม่เกิน 500 MB
SystemMaxUse=1G

# เก็บ log ไม่เกิน 30 วัน
MaxRetentionSec=30day

# แต่ละไฟล์ journal ไม่เกิน 50 MB
MaxFileSec=1week

# ต้องเหลือ disk ว่างอย่างน้อย 1 GB เสมอ
SystemKeepFree=1G
