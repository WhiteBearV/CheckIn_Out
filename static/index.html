<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Attendance Dashboard</title>
    <!-- Apply theme before Vue mounts to prevent flash -->
    <script>
      ;(function() {
        var t = localStorage.getItem('face-dashboard-theme') || 'auto'
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <!--
      Google Fonts: Sarabun
      รองรับภาษาไทยได้ดี ถ้าไม่มี internet ให้ลบบรรทัดนี้ออก
      แล้วเปลี่ยน font ใน tailwind.config.js เป็น system-ui
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/dashboard/assets/index-DBzP5nok.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-zWIDvrnu.css">
  </head>
  <body>
    <!-- Vue 3 mount point — ห้ามลบ div นี้ -->
    <div id="app"></div>
  </body>
</html>
