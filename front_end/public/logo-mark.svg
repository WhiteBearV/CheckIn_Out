
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Face Attendance">
  <defs>
    
    <radialGradient id="glow-dark" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.55"></stop>
      <stop offset="55%" stop-color="#00ffff" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"></stop>
    </radialGradient>
    
    <radialGradient id="glow-light" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#007a7a" stop-opacity="0.45"></stop>
      <stop offset="55%" stop-color="#007a7a" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#007a7a" stop-opacity="0"></stop>
    </radialGradient>
    
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"></feGaussianBlur>
    </filter>
  </defs>

  
  <g id="dark">
    
    <rect x="0" y="0" width="64" height="64" fill="url(#glow-dark)"></rect>

    
    <g fill="none" stroke="#00ffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      
      <path d="M 8 14 L 8 8 L 14 8"></path>
      
      <path d="M 50 8 L 56 8 L 56 14"></path>
      
      <path d="M 56 50 L 56 56 L 50 56"></path>
      
      <path d="M 14 56 L 8 56 L 8 50"></path>
    </g>

    
    <g filter="url(#soft)" opacity="0.75">
      
      <circle cx="32" cy="26" r="7" fill="none" stroke="#00ffff" stroke-width="2.6"></circle>
      
      <path d="M 19 50 C 19 41, 25 36, 32 36 C 39 36, 45 41, 45 50" fill="none" stroke="#00ffff" stroke-width="2.6" stroke-linecap="round"></path>
    </g>

    
    <circle cx="32" cy="26" r="7" fill="none" stroke="#00ffff" stroke-width="1.75"></circle>
    
    <path d="M 19 50 C 19 41, 25 36, 32 36 C 39 36, 45 41, 45 50" fill="none" stroke="#00ffff" stroke-width="1.75" stroke-linecap="round"></path>

    
    <line x1="18" y1="32" x2="46" y2="32" stroke="#00ffff" stroke-width="0.75" stroke-opacity="0.55" stroke-dasharray="1.2 1.8"></line>
  </g>

  
  <g id="light" style="display:none">
    <rect x="0" y="0" width="64" height="64" fill="url(#glow-light)"></rect>
    <g fill="none" stroke="#007a7a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 14 L 8 8 L 14 8"></path>
      <path d="M 50 8 L 56 8 L 56 14"></path>
      <path d="M 56 50 L 56 56 L 50 56"></path>
      <path d="M 14 56 L 8 56 L 8 50"></path>
    </g>
    <circle cx="32" cy="26" r="7" fill="none" stroke="#007a7a" stroke-width="1.75"></circle>
    <path d="M 19 50 C 19 41, 25 36, 32 36 C 39 36, 45 41, 45 50" fill="none" stroke="#007a7a" stroke-width="1.75" stroke-linecap="round"></path>
    <line x1="18" y1="32" x2="46" y2="32" stroke="#007a7a" stroke-width="0.75" stroke-opacity="0.55" stroke-dasharray="1.2 1.8"></line>
  </g>
</svg>